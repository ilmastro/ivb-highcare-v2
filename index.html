<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1117" id="themeMetaColor">
  <title>DE SPRENG</title>
  <link rel="manifest" href="manifest.json">

  <!-- Identity widget loads synchronously so token handler can open it immediately -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- BUG FIX 6: added crossorigin — required for CORS font fetches to benefit from preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="app-header">
    <div class="header-left">
      <div class="header-logo"><img src="icon-512.png" alt="logo"></div>
      <div class="header-text">
        <div class="header-title">DE SPRENG</div>
        <div class="header-sub">Informatiegids</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn lang-btn" id="langBtn" title="Switch language" onclick="event.stopPropagation();setLang(currentLang === 'en' ? 'nl' : 'en')">
        <span class="lang-nl lang-active">NL</span><span class="lang-sep">/</span><span class="lang-en">EN</span>
      </button>
      <div class="icon-btn search-btn" id="searchBtn" title="Zoeken"><span class="btn-icon" id="searchIcon">🔍</span></div>
      <div class="icon-btn theme-btn" id="themeBtn" title="Thema wisselen"><span class="btn-icon" id="themeIcon">🌙</span></div>
    </div>
  </div>

  <!-- SEARCH OVERLAY -->
  <div id="searchOverlay">
    <div class="search-bar">
      <span style="font-size:18px;flex-shrink:0;">🔍</span>
      <input type="text" id="searchInput" placeholder="Zoek in de gids…" autocomplete="off">
      <span class="search-cancel" id="searchCancel">Annuleer</span>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- CONTENT PANELS (populated by render.js) -->
  <div class="content-area" id="contentArea">
    <div class="panel active" id="panel-home"></div>
    <div class="panel"        id="panel-team"></div>
    <div class="panel"        id="panel-dag"></div>
    <div class="panel"        id="panel-regels"></div>
    <div class="panel"        id="panel-contact"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active" id="nav-home"    onclick="goTo('home')">   <i class="ti ti-home"></i>           <span>Home</span></div>
    <div class="nav-item"        id="nav-team"    onclick="goTo('team')">   <i class="ti ti-users"></i>          <span>Team</span></div>
    <div class="nav-item"        id="nav-dag"     onclick="goTo('dag')">    <i class="ti ti-calendar"></i>       <span>Programma</span></div>
    <div class="nav-item"        id="nav-regels"  onclick="goTo('regels')"> <i class="ti ti-clipboard-list"></i> <span>Regels</span></div>
    <div class="nav-item"        id="nav-contact" onclick="goTo('contact')"><i class="ti ti-phone"></i>          <span>Contact</span></div>
  </div>

</div><!-- /app -->

<!-- JS: order matters — theme & nav first, then render, then search -->
<script src="js/lang.js"></script>
<script src="js/theme.js"></script>
<script src="js/nav.js"></script>
<script src="js/accordion.js"></script>
<script src="js/render.js"></script>
<script src="js/search.js"></script>

<!-- Update banner — hidden until a new SW is waiting -->
<div id="updateBanner" style="
  display:none;
  position:fixed;
  bottom:calc(var(--nav-h) + 10px);
  left:50%;
  transform:translateX(-50%);
  background:var(--teal);
  color:#fff;
  padding:11px 18px;
  border-radius:24px;
  font-family:var(--font-body);
  font-size:13px;
  font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.2);
  white-space:nowrap;
  cursor:pointer;
  z-index:9998;
  display:none;
  align-items:center;
  gap:8px;
">
  <i class="ti ti-refresh" style="font-size:16px"></i>
  Update beschikbaar — tik om te vernieuwen
</div>

<script>
  /* ── Netlify Identity: handle invite & recovery tokens ──
     The widget script is now synchronous (no defer), so netlifyIdentity
     is available immediately. We just need to open the modal and let the
     widget handle the token that's already in the hash — no clearing or
     re-applying needed. The widget reads window.location.hash itself. */
  (function () {
    var hash = window.location.hash;
    if (hash && (hash.indexOf('invite_token=') !== -1 || hash.indexOf('recovery_token=') !== -1)) {
      /* Widget is already loaded (no defer), open it immediately */
      window.netlifyIdentity && window.netlifyIdentity.open();
    }
  })();

  /* ── Netlify Identity redirect on login ── */
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', function (user) {
      if (!user) {
        window.netlifyIdentity.on('login', function () {
          document.location.href = '/admin/';
        });
      }
    });
  }

  /* ── Service Worker registration + update detection ──────────────
     Strategy:
     1. Register the SW as normal.
     2. If a new SW is already waiting on load, show the banner immediately.
     3. If a new SW installs while the page is open, show the banner then.
     4. Every 30 minutes, nudge the browser to check for a new SW file.
        (Browser only checks on navigation by default — this covers long sessions.)
     5. When the user taps the banner, tell the waiting SW to activate,
        then reload so all clients get the new version.
  ──────────────────────────────────────────────────────────────────── */
  const UPDATE_INTERVAL_MS = 30 * 60 * 1000; /* 30 minutes */

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {

      /* Helper: show the update banner */
      function showUpdateBanner() {
        const banner = document.getElementById('updateBanner');
        if (banner) {
          banner.style.display = 'flex';
          /* Animate in */
          banner.style.opacity = '0';
          banner.style.transition = 'opacity 0.4s ease';
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              banner.style.opacity = '1';
            });
          });
        }
      }

      /* Helper: activate waiting SW and reload */
      function applyUpdate() {
        const waiting = reg.waiting;
        if (waiting) {
          /* Guard flag: ensure we only reload once even if both
             controllerchange and the fallback below fire */
          var reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!reloading) { reloading = true; window.location.reload(); }
          }, { once: true });
          waiting.postMessage({ type: 'SKIP_WAITING' });
        } else {
          window.location.reload();
        }
      }

      /* Banner tap handler */
      const banner = document.getElementById('updateBanner');
      if (banner) banner.addEventListener('click', applyUpdate);

      /* Case 1: a new SW was already waiting when the page loaded */
      if (reg.waiting) {
        showUpdateBanner();
      }

      /* Case 2: a new SW finishes installing while the page is open */
      reg.addEventListener('updatefound', function () {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', function () {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            /* New SW installed and waiting — existing clients still on old one */
            showUpdateBanner();
          }
        });
      });

      /* Case 3: periodic check every 30 minutes for long-running sessions */
      setInterval(function () {
        reg.update().catch(function () { /* ignore network errors */ });
      }, UPDATE_INTERVAL_MS);

    }).catch(function (err) {
      console.warn('SW registration failed:', err);
    });
  }
</script>
</body>
</html>
