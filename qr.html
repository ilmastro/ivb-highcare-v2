<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117" id="themeColor">
  <title>De Spreng — QR Code</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:       #0f1117;
      --bg2:      #161b26;
      --surface:  #1c2235;
      --border:   rgba(255,255,255,0.08);
      --border2:  rgba(255,255,255,0.15);
      --text1:    #eef1f8;
      --text2:    #8b95b0;
      --text3:    #4a5270;
      --accent:   #4ab8e8;
      --teal:     #3dbfbf;
      --accent-bg:rgba(74,184,232,0.10);
      --radius:   16px;
      --radius-sm:10px;
      --tr:       0.2s ease;
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg:       #f2f4f9;
      --bg2:      #ffffff;
      --surface:  #ffffff;
      --border:   rgba(0,0,0,0.07);
      --border2:  rgba(0,0,0,0.14);
      --text1:    #111520;
      --text2:    #4a5270;
      --text3:    #9ba3b8;
      --accent:   #2d6ecf;
      --accent-bg:rgba(45,110,207,0.08);
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text1);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background var(--tr), color var(--tr);
    }

    /* ── TOPBAR ──────────────────────────────────────────── */
    .topbar {
      width: 100%;
      max-width: 560px;
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-row { display: flex; align-items: center; gap: 10px; }

    .logo-img {
      width: 34px; height: 34px;
      border-radius: 9px; object-fit: cover;
      background: var(--surface);
    }

    .logo-text { font-size: 14px; font-weight: 600; color: var(--text1); letter-spacing: 0.4px; }
    .logo-sub  { font-size: 11px; color: var(--text3); margin-top: 1px; }

    .topbar-right { display: flex; gap: 8px; }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border2);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 15px; transition: all var(--tr); user-select: none;
    }
    .icon-btn:hover { background: var(--bg2); }

    /* ── MAIN ────────────────────────────────────────────── */
    .main {
      width: 100%;
      max-width: 560px;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── QR CARD ─────────────────────────────────────────── */
    .qr-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .qr-wrapper {
      background: #fff;
      border-radius: var(--radius-sm);
      padding: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    }

    .qr-wrapper canvas,
    .qr-wrapper img { display: block; }

    .qr-label {
      text-align: center;
    }

    .qr-label h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--text1);
      margin-bottom: 6px;
    }

    .qr-label p {
      font-size: 13.5px;
      color: var(--text2);
      line-height: 1.55;
      max-width: 300px;
    }

    .qr-url {
      font-size: 11.5px;
      color: var(--text3);
      font-family: monospace;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 6px 12px;
      word-break: break-all;
      text-align: center;
      max-width: 340px;
    }

    /* ── ACTIONS ─────────────────────────────────────────── */
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: 50px;
      cursor: pointer;
      border: none;
      transition: all var(--tr);
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(74,184,232,0.2);
    }

    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text1);
      border: 1px solid var(--border2);
    }

    .btn-secondary:hover { background: var(--bg2); }

    .btn svg {
      width: 16px; height: 16px;
      fill: none; stroke: currentColor;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── URL EDITOR ──────────────────────────────────────── */
    .url-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    .url-card label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 10px;
    }

    .url-input-row {
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text1);
      outline: none;
      transition: border-color var(--tr);
    }

    .url-input:focus { border-color: var(--accent); }
    .url-input::placeholder { color: var(--text3); }

    .url-apply-btn {
      background: var(--accent-bg);
      border: 1px solid rgba(74,184,232,0.25);
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--tr);
      white-space: nowrap;
    }

    .url-apply-btn:hover { background: var(--accent); color: #fff; }

    .url-hint {
      font-size: 12px;
      color: var(--text3);
      margin-top: 8px;
      line-height: 1.5;
    }

    /* ── PRINT STYLES ────────────────────────────────────── */
    @media print {
      body { background: #fff; color: #000; }
      .topbar, .url-card, .action-row, .print-hide { display: none !important; }
      .qr-card {
        border: none; box-shadow: none;
        background: #fff;
        padding: 20px;
      }
      .qr-wrapper { box-shadow: 0 0 0 1px #ddd; }
      .qr-label h2, .qr-label p { color: #000; }
      .qr-url { color: #555; background: #f5f5f5; border-color: #ddd; }
      .main { padding: 0; max-width: 100%; }
    }

    /* ── ANIMATIONS ──────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .qr-card  { animation: fadeUp 0.35s ease both; }
    .url-card { animation: fadeUp 0.35s 0.1s ease both; }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo-row">
      <img class="logo-img" src="icon-512.png" alt="" onerror="this.style.display='none'">
      <div>
        <div class="logo-text">IVB High Care</div>
        <div class="logo-sub">QR Code generator</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="icon-btn" id="themeToggle" title="Thema wisselen">🌙</div>
      <div class="icon-btn print-hide" onclick="window.print()" title="Afdrukken">🖨️</div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- QR CARD -->
    <div class="qr-card">
      <div class="qr-wrapper" id="qrWrapper">
        <!-- QR canvas injected here -->
      </div>

      <div class="qr-label">
        <h2>Scan om de app te installeren</h2>
        <p>Scan deze code met uw telefoon en volg de instructies om de app te installeren op uw startscherm.</p>
      </div>

      <div class="qr-url" id="qrUrlDisplay">—</div>

      <div class="action-row print-hide">
        <button class="btn btn-primary" onclick="downloadQR()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PNG
        </button>
        <button class="btn btn-secondary" onclick="window.print()">
          <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Afdrukken
        </button>
        <a class="btn btn-secondary" id="openInstallLink" href="#" target="_blank">
          <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Open pagina
        </button>
      </div>
    </div>

    <!-- URL EDITOR -->
    <div class="url-card print-hide">
      <label>Installatiepagina URL</label>
      <div class="url-input-row">
        <input type="url" class="url-input" id="urlInput"
               placeholder="https://uwsite.netlify.app/install.html">
        <button class="url-apply-btn" onclick="applyURL()">Bijwerken</button>
      </div>
      <div class="url-hint">
        Pas de URL aan als de site op een ander domein staat. De QR-code wordt direct opnieuw gegenereerd.
      </div>
    </div>

  </main>

  <!-- qrcodejs — battle-tested QR library, served from cdnjs (no tracking) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
  // ── App state ─────────────────────────────────────────────
  let currentURL = '';
  let qrInstance = null;

  function getInstallURL() {
    const base = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
    return base + 'install.html';
  }

  function renderQR(url) {
    currentURL = url;
    const wrapper = document.getElementById('qrWrapper');

    if (qrInstance) {
      qrInstance.clear();
      wrapper.innerHTML = '';
      qrInstance = null;
    }

    try {
      qrInstance = new QRCode(wrapper, {
        text: url,
        width: 256,
        height: 256,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
    } catch(e) {
      wrapper.innerHTML = '<div style="padding:40px;color:#f07a3a;font-size:13px;text-align:center">Fout bij genereren QR:<br>' + e.message + '</div>';
    }

    document.getElementById('qrUrlDisplay').textContent = url;
    document.getElementById('urlInput').value = url;
    const link = document.getElementById('openInstallLink');
    if (link) link.href = url;
  }

  function applyURL() {
    const val = document.getElementById('urlInput').value.trim();
    if (val) renderQR(val);
  }

  function downloadQR() {
    const canvas = document.querySelector('#qrWrapper canvas');
    if (!canvas) return;
    const a = document.createElement('a');
    a.download = 'ivb-highcare-qr.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  // ── Theme ─────────────────────────────────────────────────
  const toggle = document.getElementById('themeToggle');
  const themeColor = document.getElementById('themeColor');
  let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  try { const s = localStorage.getItem('ivb-qr-theme'); if (s) isDark = s === 'dark'; } catch(e){}

  function applyTheme() {
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    toggle.textContent = isDark ? '🌙' : '☀️';
    themeColor.content = isDark ? '#0f1117' : '#f2f4f9';
    try { localStorage.setItem('ivb-qr-theme', isDark ? 'dark' : 'light'); } catch(e){}
  }

  applyTheme();
  toggle.addEventListener('click', () => { isDark = !isDark; applyTheme(); });

  // ── Init ──────────────────────────────────────────────────
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') applyURL();
  });

  renderQR(getInstallURL());
  </script>

</body>
</html>
